<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="styles.css">
</helmet>
<footer style="position:relative;background:var(--bg-elevated);border-top:1px solid var(--border);overflow:hidden;">
  <div style="position:absolute;inset:0;background-image:var(--bg-dots);background-size:var(--bg-dots-size);opacity:.5;pointer-events:none;"></div>
  <div style="position:absolute;top:0;left:0;right:0;height:1px;background:var(--grad-holo);opacity:.7;"></div>
  <div style="position:relative;max-width:var(--container-max);margin:0 auto;padding:72px 24px 32px;">
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:48px 32px;">

      <div style="max-width:340px;">
        <a href="Home.dc.html" style="display:inline-flex;align-items:center;gap:11px;text-decoration:none;margin-bottom:18px;">
          <img src="assets/er-logo.png" alt="Esporte em Rota" style="height:68px;width:auto;display:block;" />
        </a>
        <p style="font-size:14.5px;line-height:1.65;color:var(--text-muted);margin-bottom:22px;">{{ tagline }}</p>
        <div style="display:flex;gap:10px;">

          </a>
          <a href="https://wa.me/5511944911475" target="_blank" rel="noopener" aria-label="WhatsApp" style="display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:11px;border:1px solid var(--border-strong);background:var(--surface-2);color:var(--text);transition:var(--transition-base);" style-hover="color:var(--cyan-400);border-color:var(--border-glow);">
            <svg viewBox="0 0 24 24" width="19" height="19" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51l-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347M12.05 21.785h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.002-5.45 4.437-9.884 9.889-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413"/></svg>
          </a>
        </div>
      </div>

      <div>
        <div style="font-family:var(--font-mono);font-size:12px;letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-faint);margin-bottom:18px;">{{ colProduct }}</div>
        <div style="display:flex;flex-direction:column;gap:12px;">
          <a href="ORBI-Analysis.dc.html" style="font-size:14.5px;color:var(--text-muted);text-decoration:none;transition:color var(--dur-base);" style-hover="color:var(--cyan-400);">ORION Analysis</a>
          <a href="Escolinhas.dc.html" style="font-size:14.5px;color:var(--text-muted);text-decoration:none;transition:color var(--dur-base);" style-hover="color:var(--cyan-400);">{{ linkEsc }}</a>
          <a href="Camera.dc.html" style="font-size:14.5px;color:var(--text-muted);text-decoration:none;transition:color var(--dur-base);" style-hover="color:var(--cyan-400);">{{ linkCam }}</a>
        </div>
      </div>

      <div>
        <div style="font-family:var(--font-mono);font-size:12px;letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-faint);margin-bottom:18px;">{{ colCompany }}</div>
        <div style="display:flex;flex-direction:column;gap:12px;">
          <a href="Sobre.dc.html" style="font-size:14.5px;color:var(--text-muted);text-decoration:none;transition:color var(--dur-base);" style-hover="color:var(--cyan-400);">{{ linkSobre }}</a>
          <a href="Contato.dc.html" style="font-size:14.5px;color:var(--text-muted);text-decoration:none;transition:color var(--dur-base);" style-hover="color:var(--cyan-400);">{{ linkContato }}</a>
          <a href="Contato.dc.html" style="font-size:14.5px;color:var(--text-muted);text-decoration:none;transition:color var(--dur-base);" style-hover="color:var(--cyan-400);">{{ linkDemo }}</a>
        </div>
      </div>

      <div>
        <div style="font-family:var(--font-mono);font-size:12px;letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-faint);margin-bottom:18px;">{{ colContact }}</div>
        <div style="display:flex;flex-direction:column;gap:14px;">
          <a href="https://wa.me/5511944911475" target="_blank" rel="noopener" style="display:flex;align-items:center;gap:10px;font-size:14.5px;color:var(--text);text-decoration:none;transition:color var(--dur-base);" style-hover="color:var(--cyan-400);">
            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="var(--cyan-400)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.9.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
            (11) 94491-1475
          </a>
          <a href="mailto:contato@esporteemrota.com.br" style="display:flex;align-items:center;gap:10px;font-size:14.5px;color:var(--text);text-decoration:none;transition:color var(--dur-base);word-break:break-all;" style-hover="color:var(--cyan-400);">
            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="var(--cyan-400)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none;"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 5L2 7"/></svg>
            contato@esporteemrota.com.br
          </a>
          <div style="display:flex;align-items:center;gap:10px;font-size:14.5px;color:var(--text-muted);">
            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="var(--cyan-400)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none;"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
            São Paulo, Brasil
          </div>
        </div>
      </div>
    </div>

    <div style="margin-top:56px;padding-top:24px;border-top:1px solid var(--border);display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;">
      <span style="font-family:var(--font-mono);font-size:12.5px;color:var(--text-faint);">© 2026 Esporte em Rota. {{ rights }}</span>
      <span style="font-family:var(--font-mono);font-size:11px;letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-faint);">{{ signature }}</span>
    </div>
  </div>
</footer>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:420},&quot;lang&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;pt&quot;,&quot;en&quot;],&quot;default&quot;:&quot;pt&quot;,&quot;tsType&quot;:&quot;'pt'|'en'&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const lang = this.props.lang === 'en' ? 'en' : 'pt';
    const L = {
      pt: {
        tagline: 'Inovação e profissionalismo no desenvolvimento de atletas.',
        colProduct: 'Produto', colCompany: 'Empresa', colContact: 'Contato',
        linkEsc: 'ORION Academy', linkCam: 'ORBI Go',
        linkSobre: 'Sobre', linkContato: 'Contato', linkDemo: 'Ative sua análise',
        rights: 'Todos os direitos reservados.', signature: '// Cada jogo vira dado',
      },
      en: {
        tagline: 'Innovation and professionalism in athlete development.',
        colProduct: 'Product', colCompany: 'Company', colContact: 'Contact',
        linkEsc: 'ORION Academy', linkCam: 'ORBI Go',
        linkSobre: 'About', linkContato: 'Contact', linkDemo: 'Activate your analysis',
        rights: 'All rights reserved.', signature: '// Every match becomes data',
      },
    }[lang];
    return L;
  }
}
</script>
</body>
</html>
